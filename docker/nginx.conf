# Single port 80. Three clients live under path prefixes; bare-IP visits
# redirect to /tv so the bar staff can type just the IP into a venue TV.
#
# Order matters in nginx: longest/exact prefix wins for `location` (regex
# locations have higher precedence but we don't use them here). The `= /`
# exact match keeps the redirect from also catching /tv, /host, /player.
server {
    listen 80;

    # Bare IP → TV display (the URL bar staff most often types).
    location = / { return 302 /tv/; }

    # Slashless prefix visits → canonical trailing-slash form. Without these,
    # /tv (no slash) misses the /tv/ location block and returns 404.
    location = /tv     { return 302 /tv/; }
    location = /host   { return 302 /host/; }
    location = /player { return 302 /player/; }

    # API + WebSocket — shared by all clients via same-origin requests.
    location /auth {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /packs {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /rooms {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Static SPAs. `alias` (not `root`) strips the matched prefix before file
    # lookup. The try_files fallback lands deep links (/tv/MURP,
    # /player/join/CODE) on the SPA's index.html so client-side state can
    # re-bootstrap after a hard refresh.
    location /tv/ {
        alias /usr/share/nginx/html/tv/;
        try_files $uri $uri/ /tv/index.html;
    }

    location /host/ {
        alias /usr/share/nginx/html/host/;
        try_files $uri $uri/ /host/index.html;
    }

    location /player/ {
        alias /usr/share/nginx/html/player/;
        try_files $uri $uri/ /player/index.html;
    }
}
