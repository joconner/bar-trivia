services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bartrivia
      POSTGRES_USER: bartrivia
      POSTGRES_PASSWORD: bartrivia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bartrivia"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    env_file: .env.docker
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://bartrivia:bartrivia@postgres:5432/bartrivia
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    ports:
      # Single port. Clients live at /tv, /host, /player; bare IP redirects to /tv.
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
