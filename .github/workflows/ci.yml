name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present

  golden-path:
    name: Golden-path integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bartrivia_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/bartrivia_test
      JWT_SECRET: ci-test-jwt-secret-must-be-32-chars!
      COOKIE_SECRET: ci-test-cookie-secret-32-chars-min!
      NODE_ENV: test
      ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Apply DB schema and seed
        run: cd packages/server && npx prisma db push && npx prisma db seed

      - name: Start server in background
        run: |
          cd packages/server
          npx ts-node --transpile-only src/main.ts &
          echo $! > /tmp/server.pid
        env:
          PORT: 3000

      - name: Wait for server to be ready
        run: |
          timeout 60 bash -c \
            'until curl -sf http://localhost:3000/health; do echo "waiting..."; sleep 2; done'

      - name: Run golden-path tests
        run: |
          SERVER_URL=http://localhost:3000 \
          JWT_SECRET=ci-test-jwt-secret-must-be-32-chars! \
          DATABASE_URL=postgresql://testuser:testpassword@localhost:5432/bartrivia_test \
          node packages/server/test/golden-path.mjs

      - name: Stop server
        if: always()
        run: kill $(cat /tmp/server.pid) 2>/dev/null || true
