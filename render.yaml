# Render.com deployment configuration for Bar Trivia.
#
# Free-tier setup: single Web Service running NestJS + the three React SPAs.
# Uses SQLite so no external database is required — zero-credential deploy.
# Just connect this repo on Render and click Deploy.
#
# One-click deploy: https://render.com/deploy
#
# Setup steps (once, ~5 min):
#   1. Go to https://render.com → New → Web Service → connect joconner/bar-trivia
#   2. Render detects this file and fills in build/start commands automatically.
#   3. JWT_SECRET and COOKIE_SECRET are auto-generated.
#   4. Click "Create Web Service" → deploy starts.
#
# Optional Stripe billing (hosts need a subscription after trial period):
#   Set STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, and STRIPE_MONTHLY_PRICE_ID
#   in the Render dashboard. Create a webhook in Stripe pointing to
#   https://<your-app>.onrender.com/subscriptions/webhook with events:
#   checkout.session.completed, customer.subscription.*, invoice.payment_failed
#
# Free-tier caveats:
#   - The service spins down after 15 min of inactivity. First request after
#     sleep takes ~30s (cold start: prisma db push + seed).
#   - SQLite db is on Render's ephemeral disk — data is lost on redeploy.
#     For persistent data, set DATABASE_URL to a Neon PostgreSQL connection
#     string and change prisma schema provider back to "postgresql".
#   - 512 MB RAM, shared CPU — fine for demos and small playtest sessions.

services:
  - type: web
    name: bar-trivia
    env: node
    plan: free
    region: oregon
    buildCommand: NODE_ENV=development npm ci && npm run build --workspace=packages/tv --workspace=packages/host --workspace=packages/player && cd packages/server && npx prisma generate --schema=prisma/schema.sqlite.prisma
    startCommand: cd packages/server && npx prisma db push --schema=prisma/schema.sqlite.prisma && npx prisma db seed && npx ts-node --transpile-only src/main.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prisma/bar-trivia.db
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      # --- Stripe billing (optional — hosts get a 14-day trial without it) ---
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_MONTHLY_PRICE_ID
        sync: false
