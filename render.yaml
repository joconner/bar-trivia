# Render.com deployment configuration for Bar Trivia.
#
# Free-tier setup: single Web Service running NestJS + the three React SPAs
# as static files. No managed database — use an external free-tier PostgreSQL
# (Neon is recommended: https://neon.tech, free tier, no credit card required).
#
# One-click deploy: https://render.com/deploy
#
# Manual setup steps (once):
#   1. Create a free Neon project at https://neon.tech and copy the connection string.
#   2. Click "New Web Service" on Render, connect this repo.
#   3. Set DATABASE_URL to your Neon connection string in the Render dashboard.
#      JWT_SECRET and COOKIE_SECRET are auto-generated by Render.
#   4. For Stripe billing: set STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, and
#      STRIPE_MONTHLY_PRICE_ID in the Render dashboard. Create a webhook endpoint
#      in Stripe pointing to https://<your-app>.onrender.com/subscriptions/webhook
#      with events: checkout.session.completed, customer.subscription.created,
#      customer.subscription.updated, customer.subscription.deleted,
#      invoice.payment_failed
#   5. Hit Deploy.
#
# Free-tier caveats:
#   - The service spins down after 15 min of inactivity. First request after
#     sleep takes ~30s to boot (cold start includes prisma db push + seed).
#   - 512 MB RAM, shared CPU — fine for demos and small playtest sessions.

services:
  - type: web
    name: bar-trivia
    env: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build --workspace=packages/tv --workspace=packages/host --workspace=packages/player
    startCommand: cd packages/server && npx prisma db push && npx prisma db seed && npx ts-node --transpile-only src/main.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Set this in the Render dashboard to your Neon connection string
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false  # Optional: set to https://<your-app>.onrender.com if you separate clients
      # --- Stripe billing (required for paid subscriptions) ---
      # Get keys from https://dashboard.stripe.com/apikeys
      - key: STRIPE_SECRET_KEY
        sync: false  # Set to sk_live_... in the Render dashboard
      - key: STRIPE_WEBHOOK_SECRET
        sync: false  # Set to whsec_... from your Stripe webhook endpoint
      - key: STRIPE_MONTHLY_PRICE_ID
        sync: false  # Set to price_... for your monthly subscription product
      # STRIPE_TRIAL_DAYS defaults to 14 if not set
